# NovelForge — 本地预构建镜像版
# 适用于：本地 build 后导出 tar 传到服务器导入的场景
# 镜像标签固定为 novelforge:latest（由 docker load 导入）
#
# 使用方式：
#   1. 本地: docker build -f docker/Dockerfile -t novelforge:latest .
#   2. 本地: docker save novelforge:latest > novelforge.tar
#   3. 传到服务器
#   4. 服务器: docker load < novelforge.tar
#   5. 服务器: docker compose -f docker/docker-compose.local.yml up -d

services:
  app:
    image: novelforge:latest
    ports:
      - "8086:3000"
    environment:
      - DATABASE_URL=postgresql://novelforge:${DB_PASSWORD}@db:5432/novelforge
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION}
      - NODE_ENV=production
    volumes:
      - ../uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=novelforge
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=novelforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    restart: unless-stopped

volumes:
  pgdata:
