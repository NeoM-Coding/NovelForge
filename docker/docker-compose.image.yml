# NovelForge — 预构建镜像版（无需本地 Build，30 秒启动）
# 直接从 GitHub Container Registry 拉取已编译好的镜像
#
# 前置条件：
#   1. 仓库 Owner 已将 GitHub Packages 设为公开
#      （仓库主页 → Packages → novelforge → Package settings → Public）
#   2. GitHub Actions 已至少成功构建一次镜像
#      （https://github.com/NeoM-Coding/NovelForge/actions）
#
# 使用方式：
#   1. 复制 .env.example 为 .env，填写 API Key
#   2. docker compose -f docker/docker-compose.image.yml pull
#   3. docker compose -f docker/docker-compose.image.yml up -d
#   4. 打开 http://localhost:3002

services:
  app:
    image: ghcr.io/neom-coding/novelforge:master
    pull_policy: always
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://novelforge:${DB_PASSWORD}@db:5432/novelforge
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - NODE_ENV=production
    volumes:
      - ../uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=novelforge
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=novelforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelforge -d novelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
